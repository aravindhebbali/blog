[build]
  publish = "_site"
  command = "quarto render"

[build.environment]
  QUARTO_VERSION = "1.6.39"

[[plugins]]
package = "@quarto/netlify-plugin-quarto"
  [plugins.inputs]
  version = "1.6.39"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Legacy permalinks (/:year/:month/:day/:slug/) mapped to the Quarto /posts/<slug>/ URLs.
[[redirects]]
  from = "/2019/02/07/introducing-olsrr/"
  to = "/posts/introducing-olsrr/"
  status = 301
  force = true

[[redirects]]
  from = "/2019/02/07/introducing-olsrr/*"
  to = "/posts/introducing-olsrr/"
  status = 301
  force = true

