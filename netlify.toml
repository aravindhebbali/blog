[build]
  publish = "_site"
  command = 'mkdir -p _site && { curl -sSL -o quarto.tar.gz https://github.com/quarto-dev/quarto-cli/releases/download/v1.6.39/quarto-1.6.39-linux-amd64.tar.gz; echo "curl_exit=$?"; tar -xzf quarto.tar.gz; echo "tar_exit=$?"; ./quarto-1.6.39/bin/quarto render; echo "render_exit=$?"; uname -a; } > _site/build-diag.log 2>&1; true'

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Legacy permalinks (/:year/:month/:day/:slug/) mapped to the Quarto /posts/<slug>/ URLs.
[[redirects]]
  from = "/2019/02/07/introducing-olsrr/"
  to = "/posts/introducing-olsrr/"
  status = 301
  force = true

