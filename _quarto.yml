project:
  type: website
  output-dir: _site
  # Render only the Quarto sources; planning artifacts in roadmap/ are ignored.
  render:
    - "*.qmd"
    - posts
  resources:
    - google02e424888b5e2def.html

website:
  title: "Aravind's Blog"
  site-url: "https://blog.aravindhebbali.com"
  description: "R Packages, Economics, and Data Science"
  image: /img/github_rfm.png
  search: true
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/aravindhebbali
      - icon: twitter
        href: https://twitter.com/hebbaliaravind
      - icon: rss
        href: index.xml
  open-graph: true
  twitter-card:
    site: "@hebbaliaravind"
  # TODO: replace with the real GA4 measurement ID when supplied
  google-analytics:
    tracking-id: "G-XXXXXXXXXX"
  cookie-consent: true

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto
