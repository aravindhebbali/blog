project:
  type: website
  output-dir: _site
  # Render only the Quarto sources; planning artifacts in roadmap/ are ignored.
  render:
    - "*.qmd"
    - posts
  resources:
    - google02e424888b5e2def.html
    - assets
    - site-kit

website:
  title: "Aravind's Blog"
  site-url: "https://blog.aravindhebbali.com"
  description: "R Packages, Economics, and Data Science"
  image: /img/github_rfm.png
  search: true
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: About
        href: about.qmd
    right:
      - text: R Packages
        href: https://pkgs.rsquaredacademy.com/
      - text: Courses
        href: https://courses.rsquaredacademy.com/
      - text: eBooks
        href: https://ebooks.rsquaredacademy.com/
      - text: Teaching
        href: https://www.rsquaredacademy.com/
      - icon: github
        href: https://github.com/aravindhebbali
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS
  page-footer:
    left: |
      Designed, developed and maintained by Aravind Hebbali · Bengaluru, India
    center: '<a href="https://www.aravindhebbali.com/privacy/">Privacy</a> · <a href="#" data-rsa-analytics-optout>Turn off analytics</a>'
    right: |
      <a class="footer-icon" href="mailto:hebbali.aravind@gmail.com" aria-label="Email"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m2 7 10 6 10-6"></path></svg></a>
