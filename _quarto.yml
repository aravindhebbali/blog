project:
  type: website
  output-dir: _site

website:
  title: "Aravind's Blog"
  site-url: "https://blog.aravindhebbali.com"
  description: "R Packages, Economics, and Data Science"
  image: /img/github_rfm.png
  search: true
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/aravindhebbali
      - icon: twitter
        href: https://twitter.com/hebbaliaravind
      - icon: rss
        href: index.xml
  open-graph: true
  twitter-card:
    site: "@hebbaliaravind"
  google-analytics:
    tracking-id: "G-XXXXXXXXXX"
  cookie-consent: true

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto
