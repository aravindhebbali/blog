format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    include-in-header:
      - includes/site-kit-head.html
    respect-user-color-scheme: true
    toc: true
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto
